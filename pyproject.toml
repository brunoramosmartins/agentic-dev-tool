[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-dev-tool"
version = "1.1.0"
description = "Context-oriented AI CLI and optional HTTP API: agents, MCP-style tools, multi-repo, OpenAI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bruno Ramos Martins" }]
maintainers = [{ name = "Bruno Ramos Martins" }]
keywords = [
  "cli",
  "ai",
  "agents",
  "mcp",
  "llm",
  "openai",
  "fastapi",
  "typer",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.9",
  "pydantic>=2.0",
  "httpx>=0.25",
  "openai>=1.0",
  "rich>=13.0",
  "jsonschema>=4.20",
  "pathspec>=0.12",
  "tiktoken>=0.5",
  "tomli>=2.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "mypy>=1.8",
  "pre-commit>=3.6",
  "build>=1.0",
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[project.scripts]
adt = "adt.cli.app:app"

[project.urls]
Homepage = "https://github.com/brunoramosmartins/agentic-dev-tool"
Repository = "https://github.com/brunoramosmartins/agentic-dev-tool"
Documentation = "https://github.com/brunoramosmartins/agentic-dev-tool/tree/main/docs"
Changelog = "https://github.com/brunoramosmartins/agentic-dev-tool/blob/main/CHANGELOG.md"
Issues = "https://github.com/brunoramosmartins/agentic-dev-tool/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/adt"]
include = [
  "src/adt/**/*.py",
  "src/adt/**/*.md",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/adt",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "docs",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["adt"]

[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pathspec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tiktoken"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tomli_w"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -m \"not live\""
markers = [
  "live: calls real external APIs (not run in CI by default)",
]

[tool.coverage.run]
source = ["adt"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
# Branch-aware total can sit just under 80 while line coverage is strong; keep CI green.
fail_under = 79
show_missing = true
