[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-dev-tool"
version = "0.4.0"
description = "Context-oriented AI assistant CLI with a simplified MCP-style tool layer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bruno Ramos Martins" }]
keywords = ["cli", "ai", "agents", "mcp", "llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.9",
  "pydantic>=2.0",
  "httpx>=0.25",
  "openai>=1.0",
  "rich>=13.0",
  "jsonschema>=4.20",
  "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "mypy>=1.8",
  "pre-commit>=3.6",
]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[project.scripts]
adt = "adt.cli.app:app"

[project.urls]
Homepage = "https://github.com/brunoramosmartins/agentic-dev-tool"
Repository = "https://github.com/brunoramosmartins/agentic-dev-tool"
Issues = "https://github.com/brunoramosmartins/agentic-dev-tool/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/adt"]

[tool.hatch.build.targets.sdist]
include = ["src/adt", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["adt"]

[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pathspec"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -m \"not live\""
markers = [
  "live: calls real external APIs (not run in CI by default)",
]

[tool.coverage.run]
source = ["adt"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
